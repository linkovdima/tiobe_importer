<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-code"></i> Языки Программирования
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/search">Поиск</a>
                <a class="nav-link" href="/login">Вход</a>
                <a class="nav-link active" href="/register">Регистрация</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 520px;">
        <h1 class="mb-3"><i class="fas fa-user-plus"></i> Регистрация</h1>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label">Имя пользователя</label>
                <input class="form-control" name="username" autocomplete="username" required>
                <div class="form-text">Используйте латиницу/цифры и `_` / `-`.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input class="form-control" type="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Повтор пароля</label>
                <input class="form-control" type="password" name="password2" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-check"></i> Создать аккаунт
            </button>
        </form>

        <div class="mt-3 text-center">
            Уже есть аккаунт?
            <a href="/login" class="link-primary">Войти</a>
        </div>
    </div>
</body>
</html>
