<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-code"></i> Языки Программирования
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/search">Поиск</a>
                <a class="nav-link active" href="/cabinet">Кабинет</a>
            </div>
            <div class="ms-auto">
                <form method="POST" action="/logout" class="d-flex">
                    <button class="btn btn-outline-light btn-sm" type="submit">
                        <i class="fas fa-right-from-bracket"></i> Выйти
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <div>
                <h1 class="mb-0"><i class="fas fa-user"></i> Личный кабинет</h1>
                <div class="text-muted">Сохраняйте ресурсы и экспортируйте библиографические данные.</div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Папки</h5>
                <div class="row g-2 align-items-end">
                    <div class="col-md-6">
                        <label class="form-label">Новая папка</label>
                        <input class="form-control" id="folderNameInput" placeholder="Например: Учебный материал">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" id="createFolderBtn">
                            <i class="fas fa-folder-plus"></i> Создать
                        </button>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Выбор папки</label>
                    <select class="form-select" id="folderSelect"></select>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                    <div>
                        <h5 class="card-title mb-0">Сохраненные ресурсы</h5>
                        <div class="text-muted" id="savedHint">Загрузка...</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary" id="refreshSavedBtn">
                            <i class="fas fa-rotate"></i> Обновить
                        </button>
                        <button class="btn btn-success" id="exportSelectedBtn" title="Экспортировать только выбранные записи">
                            <i class="fas fa-download"></i> Экспорт выбранных
                        </button>
                        <button class="btn btn-primary" id="exportAllBtn" title="Экспортировать все записи из текущей папки">
                            <i class="fas fa-download"></i> Экспорт папки
                        </button>
                    </div>
                </div>
                <div id="savedResources" class="mt-3"></div>
            </div>
        </div>

    </div>

    <script>
        // В этом проекте страницы кабинета используют API, которые появятся на следующих этапах.
        // Сейчас страница загружает заглушки, чтобы не ломать навигацию.

        let currentFolderId = null;

        async function loadFolders() {
            const select = document.getElementById('folderSelect');
            select.innerHTML = '';
            const hint = document.getElementById('savedHint');
            hint.textContent = 'Загрузка папок...';
            try {
                const res = await fetch('/api/me/folders');
                if (!res.ok) throw new Error('Не удалось получить папки');
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Ошибка');

                data.folders.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.name;
                    select.appendChild(opt);
                });

                await loadSaved();
            } catch (e) {
                hint.textContent = 'Пока API кабинета недоступен (ожидается реализация).';
            }
        }

        async function loadSaved() {
            const select = document.getElementById('folderSelect');
            const folderId = select.value;
            currentFolderId = folderId;
            const container = document.getElementById('savedResources');
            container.innerHTML = '<div class="text-muted">Загрузка...</div>';
            try {
                const res = await fetch('/api/me/saved?folder_id=' + encodeURIComponent(folderId));
                if (!res.ok) throw new Error('Не удалось получить сохраненные ресурсы');
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Ошибка');

                if (!data.resources || data.resources.length === 0) {
                    container.innerHTML = '<div class="alert alert-info mb-0">В этой папке пока нет сохраненных ресурсов.</div>';
                    return;
                }

                let html = '<div class="row row-cols-1 row-cols-md-2 g-3">';
                data.resources.forEach(r => {
                    html += `
                        <div class="col">
                            <div class="card h-100">
                                <div class="card-body">
                                    <div class="d-flex align-items-start justify-content-between gap-2">
                                        <div>
                                            <div class="text-muted small mb-1">${(r.publication_type || r.resource_type || 'Ресурс')}</div>
                                            <div class="fw-semibold mb-2">${r.title_snapshot || r.resource_uri}</div>
                                        </div>
                                        <div class="text-end">
                                            <label class="form-check-label small text-muted d-block mb-1" title="Выбор для экспорта">
                                                <input class="form-check-input me-1" type="checkbox" name="savedResourceCheckbox" value="${r.id}">
                                                Выбрать
                                            </label>
                                        </div>
                                    </div>

                                    ${r.author_snapshot ? `<div class="text-muted mb-2"><i class="fas fa-user"></i> ${r.author_snapshot}</div>` : ''}
                                    ${r.url_snapshot ? `<a class="btn btn-sm btn-outline-primary" href="${r.url_snapshot}" target="_blank" rel="noopener noreferrer">Открыть</a>` : ''}
                                    <button class="btn btn-sm btn-outline-danger ms-2 delete-saved-btn" type="button" data-saved-id="${r.id}">
                                        <i class="fas fa-trash"></i> Удалить
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (e) {
                const hint = document.getElementById('savedHint');
                hint.textContent = 'Ошибка загрузки: ' + (e?.message || 'неизвестная');
            }
        }

        document.getElementById('createFolderBtn').addEventListener('click', async () => {
            const name = document.getElementById('folderNameInput').value.trim();
            if (!name) return;
            const res = await fetch('/api/me/folders', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('folderNameInput').value = '';
                await loadFolders();
            } else {
                alert(data.error || 'Ошибка создания папки');
            }
        });

        document.getElementById('refreshSavedBtn').addEventListener('click', loadSaved);

        document.getElementById('exportAllBtn').addEventListener('click', async () => {
            const select = document.getElementById('folderSelect');
            const folderId = select.value;
            const res = await fetch('/api/me/export?format=bibtex&folder_id=' + encodeURIComponent(folderId));
            const data = await res.json();
            if (!data.success) {
                alert(data.error || 'Ошибка экспорта');
                return;
            }
            const blob = new Blob([data.bibtex], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cabinet_export.bib';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        document.getElementById('exportSelectedBtn').addEventListener('click', async () => {
            const folderId = document.getElementById('folderSelect').value;
            const ids = Array.from(document.querySelectorAll('input[name="savedResourceCheckbox"]:checked'))
                .map(i => i.value);

            if (ids.length === 0) {
                alert('Выберите хотя бы одну запись для экспорта.');
                return;
            }

            const res = await fetch(
                '/api/me/export?format=bibtex&folder_id=' + encodeURIComponent(folderId) +
                '&saved_ids=' + encodeURIComponent(ids.join(','))
            );
            const data = await res.json();
            if (!data.success) {
                alert(data.error || 'Ошибка экспорта');
                return;
            }

            const blob = new Blob([data.bibtex], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cabinet_export_selected.bib';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });

        document.getElementById('folderSelect').addEventListener('change', loadSaved);

        // Удаление сохраненного ресурса
        document.getElementById('savedResources').addEventListener('click', async (e) => {
            const btn = e.target.closest('.delete-saved-btn');
            if (!btn) return;

            const savedId = btn.dataset.savedId;
            if (!savedId) return;
            if (!confirm('Удалить ресурс из папки?')) return;

            const res = await fetch('/api/me/saved/' + encodeURIComponent(savedId), {method: 'DELETE'});
            const data = await res.json();
            if (!data.success) {
                alert(data.error || 'Не удалось удалить ресурс');
                return;
            }
            await loadSaved();
        });

        loadFolders();
    </script>
</body>
</html>
